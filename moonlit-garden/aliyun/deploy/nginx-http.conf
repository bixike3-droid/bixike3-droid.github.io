user nginx;
worker_processes 1;
pid /run/sakura-web.pid;
error_log /opt/sakura-garden/logs/error.log warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /opt/sakura-garden/logs/access.log;
 server { listen 80 default_server; server_name _; return 444; }
 server {
  listen 80;
  server_name sakura.baodaoxiaoyuan.cn;
  location /.well-known/acme-challenge/ { root /opt/sakura-garden/acme-webroot; }
  location / { default_type text/plain; return 503 'Website deployment is being completed.'; }
 }
}
