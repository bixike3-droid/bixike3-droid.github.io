user nginx;
worker_processes 1;
pid /run/sakura-web.pid;
error_log /opt/sakura-garden/logs/error.log warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /opt/sakura-garden/logs/access.log;
 server { listen 80 default_server; server_name _; return 444; }
 server {
  listen 80;
  server_name sakura.baodaoxiaoyuan.cn;
  location /.well-known/acme-challenge/ { root /opt/sakura-garden/acme-webroot; }
  location / { return 301 https://sakura.baodaoxiaoyuan.cn$request_uri; }
 }
 server {
  listen 443 ssl;
  server_name sakura.baodaoxiaoyuan.cn;
  ssl_certificate /etc/letsencrypt/live/sakura.baodaoxiaoyuan.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sakura.baodaoxiaoyuan.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  client_max_body_size 8k;
  location / {
   proxy_pass http://127.0.0.1:3210;
   proxy_http_version 1.1;
   proxy_set_header Host sakura.baodaoxiaoyuan.cn;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_connect_timeout 5s;
   proxy_read_timeout 20s;
  }
 }
}
